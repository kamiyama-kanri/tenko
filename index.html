<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点呼</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; background: #f4f6f4; color: #222; font-size: 16px; }
  h1 { color: #06a94d; text-align: center; font-size: 20px; margin: 4px 0 18px; }
  .group { background: #fff; padding: 14px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #dde3dd; }
  .group p { margin: 0 0 10px; font-weight: bold; line-height: 1.5; }
  .note { display: block; font-size: 12px; font-weight: normal; color: #666; margin-top: 4px; }
  .choices { display: flex; gap: 10px; }
  .choice { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: 2px solid #ccc; background: #fff; border-radius: 6px; }
  .choice.on { background: #06a94d; border-color: #06a94d; color: #fff; }
  input[type=file], input[type=number] { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 2px solid #ccc; border-radius: 6px; }
  #submit { width: 100%; padding: 14px; font-size: 18px; font-weight: bold; color: #fff; background: #06a94d; border: 0; border-radius: 8px; }
  #submit:disabled { background: #aaa; }
  #msg { text-align: center; color: #c33; white-space: pre-wrap; }
  #log { display: none; font-size: 12px; color: #666; white-space: pre-wrap; word-break: break-all; }
  .warn { display: block; color: #d00000; font-size: 13px; font-weight: bold; margin-top: 6px; }
  .grid-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .grid-label { flex: none; width: 6.5em; font-weight: bold; }
  .grid-row .choices { flex: 1; }
  .thumb { display: none; height: 64px; margin-top: 8px; border-radius: 4px; border: 1px solid #ccc; }
  .ok { display: none; color: #06a94d; font-size: 13px; font-weight: bold; margin-top: 4px; }
  #ver { text-align: center; color: #aaa; font-size: 11px; margin: 14px 0 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; }
</style>
</head>
<body>
<h1 id="title">読み込み中...</h1>
<div id="form"></div>
<button id="submit" hidden>送信する</button>
<p id="msg"></p>
<pre id="log"></pre>
<p id="ver"></p>

<script>
// 設定(GASのウェブアプリURLと、LIFF ID)
const LIFF_ID = "2011818456-Y4bNZe41";
const GAS_URL = "https://script.google.com/macros/s/AKfycbyAFcTsO_RQkcyHrrEgcqYklweokaUvx05E_5fVPerujFjhVd8sacMWSZJY9FbxcBd2/exec";

const FORMS = {
  start: { title: "稼働開始点呼", items: [
    { id: "bodyCheck", q: "1. 体調不良や過度な疲労など、安全運転に不安を感じる要素はありませんか？", type: "choice", opts: ["ない", "ある"] },
    { id: "carCheck", q: "2. 車両の日常点検を実施し、異常はありませんでしたか？", type: "choice", opts: ["異常なし", "異常あり"] },
    { id: "alcCheck", q: "3. アルコール検知器による測定を行いましたか？", type: "choice", opts: ["実施した", "未実施"] },
    { id: "photo", q: "4. アルコール呼気チェックシートの写真", note: "数値と日付・時間が分かるように", type: "photo" },
    { id: "photoRabbit", q: "5. ラビットにログインする前の画面", note: "ログインしていないことがわかる画面", type: "photo" },
    { id: "photoMentor", q: "6. メンターにログインした画面", note: "立ち上げていることがわかる画面", type: "photo" }
  ]},
  end: { title: "稼働終了点呼", items: [
    { id: "cycle", q: "1. 本日の稼働を教えてください", note: "当てはまるものをすべて選んでください(Cycle1・Cycle2の両方も可)", warn: "【注意】選択された稼働とロスタリングなどをもとに報酬の計算をします。正しい稼働を入力してください。",
      type: "grid", opts: ["Cycle1", "Cycle2"],
      rows: [{ key: "cycleKvan", label: "K-van🚙" }, { key: "cycleWalker", label: "Walker🚶" }] },
    { id: "breath", q: "2. アルコール検知器の測定結果の写真", note: "検知器の数値と日付・時間が分かるように撮影してください", type: "photo" },
    { id: "amazon", q: "3. Amazonアプリログアウト画面の写真", type: "photo" },
    { id: "motimodori", q: "4. 破損・持ち戻りの荷物の個数(なければ0)", type: "number" },
    { id: "mipai", q: "5. 未配の荷物の個数(なければ0)", type: "number" }
  ]}
};

const values = {};
let mode = null, busy = false;
const $ = id => document.getElementById(id);

// GAS以外(外部ホスティング)で使う場合のURLからのモード取得
function getMode() {
  const p = new URLSearchParams(location.search);
  let m = p.get("mode");
  if (!m && p.get("liff.state")) {
    m = new URLSearchParams(p.get("liff.state").replace(/^\/?\??/, "")).get("mode");
  }
  return m;
}

function render() {
  const f = FORMS[mode];
  $("title").textContent = f.title;
  document.title = f.title;
  $("form").innerHTML = "";
  f.items.forEach(it => {
    const g = document.createElement("div");
    g.className = "group";
    const p = document.createElement("p");
    p.textContent = it.q;
    if (it.note) { const s = document.createElement("span"); s.className = "note"; s.textContent = "※" + it.note; p.appendChild(s); }
    if (it.warn) { const w = document.createElement("span"); w.className = "warn"; w.textContent = it.warn; p.appendChild(w); }
    g.appendChild(p);
    if (it.type === "grid") {
      it.rows.forEach(r => {
        const line = document.createElement("div");
        line.className = "grid-row";
        const lab = document.createElement("span");
        lab.className = "grid-label"; lab.textContent = r.label;
        const row = document.createElement("div");
        row.className = "choices";
        it.opts.forEach(o => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "choice"; b.textContent = o;
          b.setAttribute("aria-pressed", "false");
          b.onclick = () => {
            const cur = values[r.key] || [];
            values[r.key] = cur.includes(o) ? cur.filter(x => x !== o) : cur.concat(o);
            const on = values[r.key].includes(o);
            b.classList.toggle("on", on);
            b.setAttribute("aria-pressed", String(on));
          };
          row.appendChild(b);
        });
        line.appendChild(lab); line.appendChild(row);
        g.appendChild(line);
      });
    } else if (it.type === "choice" || it.type === "multi") {
      const row = document.createElement("div");
      row.className = "choices";
      it.opts.forEach(o => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "choice"; b.textContent = o;
        if (it.type === "multi") {
          b.setAttribute("aria-pressed", "false");
          b.onclick = () => {
            const cur = values[it.id] || [];
            values[it.id] = cur.includes(o) ? cur.filter(x => x !== o) : cur.concat(o);
            const on = values[it.id].includes(o);
            b.classList.toggle("on", on);
            b.setAttribute("aria-pressed", String(on));
          };
        } else {
          b.onclick = () => { values[it.id] = o; row.querySelectorAll(".choice").forEach(x => x.classList.remove("on")); b.classList.add("on"); };
        }
        row.appendChild(b);
      });
      g.appendChild(row);
    } else {
      const i = document.createElement("input");
      i.id = "f_" + it.id;
      if (it.type === "photo") {
        i.type = "file"; i.accept = "image/*";
        const th = document.createElement("img"); th.className = "thumb"; th.id = "t_" + it.id;
        const ok = document.createElement("span"); ok.className = "ok"; ok.id = "o_" + it.id;
        i.onchange = () => prepPhoto(it.id, i.files[0]);
        g.appendChild(i); g.appendChild(th); g.appendChild(ok);
        $("form").appendChild(g);
        return;
      }
      else { i.type = "number"; i.min = "0"; i.inputMode = "numeric"; }
      g.appendChild(i);
    }
    $("form").appendChild(g);
  });
  $("submit").hidden = false;
}

// ---- 写真: 選んだ瞬間に小さく圧縮しておく(送信ボタンを押したときの待ち時間を減らす) ----
// 長辺1024px・画質0.6。PC画面で内容が読める大きさで、1枚あたり約60〜150KBになります
const PHOTO_SIDE = 1024, PHOTO_QUALITY = 0.6;
const photos = {};   // id -> Promise<base64>

async function compress(file) {
  let src, w, h, release = () => {};
  if (window.createImageBitmap) {
    try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); w = src.width; h = src.height; release = () => src.close && src.close(); } catch (e) { src = null; }
  }
  if (!src) {
    src = await new Promise((ok, ng) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); ok(img); };
      img.onerror = () => { URL.revokeObjectURL(url); ng(new Error("画像を読み込めませんでした")); };
      img.src = url;
    });
    w = src.naturalWidth || src.width; h = src.naturalHeight || src.height;
  }
  const s = Math.min(1, PHOTO_SIDE / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  release();
  const url = c.toDataURL("image/jpeg", PHOTO_QUALITY);
  return { base64: url.split(",")[1], url };
}

function prepPhoto(id, file) {
  const th = $("t_" + id), ok = $("o_" + id);
  th.style.display = "none"; ok.style.display = "none";
  if (!file) { delete photos[id]; return; }
  ok.style.display = "block"; ok.style.color = "#666"; ok.textContent = "写真を準備中...";
  photos[id] = compress(file).then(r => {
    th.src = r.url; th.style.display = "block";
    ok.style.color = "#06a94d"; ok.textContent = "✓ 写真OK(" + Math.round(r.base64.length * 0.75 / 1024) + "KB)";
    return r.base64;
  });
  photos[id].catch(e => { ok.style.color = "#c33"; ok.textContent = "写真を読み込めませんでした。撮り直してください"; });
}

// ---- 送信 ----
// GAS内で開いている場合は google.script.run、外部ホスティングの場合は fetch で送信(90秒で打ち切り)
function send(payload) {
  if (window.google && google.script && google.script.run) {
    return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng).submitForm(payload));
  }
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 90000);
  return fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload), signal: ac.signal })
    .then(r => r.json()).finally(() => clearTimeout(t));
}

// 通信エラーのときだけ、同じ reqId で最大2回まで自動で送り直す(サーバーが二重登録を防ぎます)
async function sendWithRetry(payload) {
  let last;
  for (let n = 0; n < 3; n++) {
    try { return await send(payload); } catch (e) { last = e; $("submit").textContent = "再送信中..."; await new Promise(r => setTimeout(r, 1500)); }
  }
  throw last;
}

let reqId = null;     // 1回の点呼につき1つ。失敗して押し直しても同じ番号を使う
let liffReady = null; // LIFFの準備(画面表示と並行して進める)

async function submit() {
  if (busy) return;
  const f = FORMS[mode], payload = { action: mode };
  for (const it of f.items) {
    if (it.type === "grid") {
      if (!it.rows.some(r => (values[r.key] || []).length)) return alert("⚠️ 本日の稼働を選択してください。\nK-van・Walkerのどれか1つ以上を選ぶ必要があります。");
      it.rows.forEach(r => { payload[r.key] = it.opts.filter(o => (values[r.key] || []).includes(o)).join(","); }); // 例: Cycle1,Cycle2
    } else if (it.type === "multi") {
      if (!values[it.id] || !values[it.id].length) return alert("⚠️ 未入力の項目があります。\n" + it.q);
      payload[it.id] = it.opts.filter(o => values[it.id].includes(o)).join(","); // 例: Cycle1,Cycle2
    } else if (it.type === "choice") {
      if (!values[it.id]) return alert("⚠️ 未入力の項目があります。\n" + it.q);
      payload[it.id] = values[it.id];
    } else if (it.type === "photo") {
      if (!photos[it.id]) return alert("⚠️ 写真が未選択です。\n" + it.q);
    } else if ($("f_" + it.id).value === "") return alert("⚠️ 未入力の項目があります。\n" + it.q);
  }
  busy = true; $("submit").disabled = true; $("submit").textContent = "送信中..."; $("msg").textContent = "";
  try {
    for (const it of f.items) {
      if (it.type === "photo") payload[it.id] = await photos[it.id];
      else if (it.type === "number") payload[it.id] = Number($("f_" + it.id).value);
    }
    await liffReady;
    payload.idToken = liff.getIDToken();
    if (!payload.idToken) { liff.login(); return; }
    payload.reqId = reqId || (reqId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8));

    const res = await sendWithRetry(payload);
    if (res && res.status === "success") {
      reqId = null;
      alert(mode === "start" ? "開始点呼が完了しました。安全運転でお願いします。" : "終了点呼が完了しました。お疲れ様でした。");
      if (liff.isInClient()) liff.closeWindow();
      else $("msg").textContent = "送信完了";
      return;
    }
    if (res && res.status !== "success") reqId = null; // サーバーが内容を受け付けなかった場合は新しい番号で
    const m = (res && res.message) || "エラーが発生しました";
    $("msg").textContent = m;
    alert(m);
  } catch (e) {
    const m = "送信できませんでした。電波の良い場所でもう一度「送信する」を押してください。(" + e.message + ")";
    $("msg").textContent = m;
    alert(m);
  }
  busy = false; $("submit").disabled = false; $("submit").textContent = "送信する";
}

let logBuf = "";
function log(t) { logBuf += t + "\n"; if ($("log").style.display === "block") $("log").textContent = logBuf; }
function showLog() { $("log").style.display = "block"; $("log").textContent = logBuf; }

const VERSION = "2026-11-12-v4";

// 画面を先に表示し、LIFFの準備は裏で進める(開くまでの待ち時間を短くする)
window.onload = async () => {
  $("ver").textContent = "ver " + VERSION;
  log("1. 画面の読み込み OK / ver " + VERSION);
  log("2. LIFF部品: " + typeof liff);
  log("3. GAS画面内で表示: " + (window.top !== window.self));
  try {
    mode = getMode();
    if (FORMS[mode]) { render(); $("submit").onclick = submit; } // 先に画面を出す
    const timer = setTimeout(() => { log("⚠ 8秒たっても先に進みません"); showLog(); }, 8000);
    log("4. LIFF初期化を開始");
    liffReady = liff.init({ liffId: LIFF_ID });
    await liffReady;
    clearTimeout(timer);
    log("5. 初期化OK / LINEアプリ内: " + liff.isInClient() + " / ログイン済み: " + liff.isLoggedIn());
    if (!liff.isLoggedIn()) { log("6. ログイン画面へ移動します"); liff.login(); return; }
    if (!mode) mode = getMode();
    if (mode === "test") { // 接続テスト用
      let name = "";
      try { name = (await liff.getProfile()).displayName; } catch (e) { name = "取得失敗: " + e.message; }
      let srv = "";
      try {
        const r = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "ping" }) }).then(x => x.json());
        srv = r && r.message ? "OK" : "応答が想定外です";
      } catch (e) { srv = "NG: " + e.message; }
      $("title").textContent = "接続テスト";
      showLog();
      $("msg").style.color = "#222";
      $("msg").textContent = "LIFF初期化: OK\nLINEアプリ内: " + liff.isInClient() + "\nログイン: " + liff.isLoggedIn() +
        "\n表示名: " + name + "\nIDトークン: " + (liff.getIDToken() ? "取得OK" : "取得できず") + "\nサーバー接続: " + srv;
      return;
    }
    if (!FORMS[mode]) { $("title").textContent = "ページが指定されていません"; $("msg").textContent = "リッチメニューから開き直してください。"; return; }
    if (!$("submit").onclick) { render(); $("submit").onclick = submit; }
  } catch (e) {
    $("title").textContent = "起動エラー";
    $("msg").textContent = "LIFFの初期化に失敗しました: " + e.message;
    log("エラー: " + (e.code || "") + " " + e.message);
    showLog();
  }
};
</script>
</body>
</html>
